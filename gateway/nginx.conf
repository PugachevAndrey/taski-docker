server {
  listen 80;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  # Статика React (и Django) — файлы лежат в /staticfiles/static/
  location /static/ {
    alias /staticfiles/static/;
    expires 30d;
  }

  # Корень — отдаём index.html React
  location / {
    root /staticfiles;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}